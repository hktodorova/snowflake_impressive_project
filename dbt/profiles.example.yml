ecommerce_rt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ROLE_ANALYTICS_ENGINEER
      database: ECOMMERCE_RT
      warehouse: WH_TRANSFORM_M
      schema: DBT
      threads: 4
      client_session_keep_alive: false
