name: ecommerce_rt
version: '1.0.0'
config-version: 2
profile: ecommerce_rt
author: 'Hristina Todorova <hktodorova@gmail.com>'

model-paths: ['models']
seed-paths: ['seeds']
test-paths: ['tests']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets: ['target', 'dbt_packages']

snapshots:
  ecommerce_rt:
    +target_schema: silver
    +strategy: check
    +check_cols: all
    +invalidate_hard_deletes: true

models:
  ecommerce_rt:
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    gold:
      +schema: gold
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    features:
      +schema: features
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
